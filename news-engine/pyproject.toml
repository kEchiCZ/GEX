[project]
name = "gexlens-news"
version = "0.1.0"
description = "SentimentLens news-engine — sběr a normalizace zpráv (SPEC kap. 3)"
requires-python = ">=3.12"
dependencies = [
    "gexlens-engine",
    # FF kalendář: Cloudflare blokuje linuxový TLS fingerprint (httpx i curl
    # z kontejneru 403, z Windows 200) — curl_cffi impersonuje Chrome (#277)
    "curl-cffi>=0.7",
    "httpx>=0.28",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gexlens_news"]

[tool.uv.sources]
gexlens-engine = { workspace = true }

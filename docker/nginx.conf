# Frontend + reverzní proxy na API (#542). Prohlížeč mluví jen s tímto serverem,
# takže port API nemusí být publikovaný a odpadá CORS (vše je same-origin).

# WebSocket upgrade: hodnota hlavičky Connection musí zmizet u běžných
# požadavků, jinak by je proxy označila za upgrade
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Strop velikosti požadavku — API samo žádný nemá (#542 H5)
    client_max_body_size 2m;

    # Bezpečnostní hlavičky. CSP je druhá vrstva pro případ, že by se do UI
    # někdy dostal neescapovaný obsah z news pipeline (dnes žádný takový sink
    # neexistuje). 'unsafe-inline' u stylů kryje <style> bloky z Vite buildu;
    # skripty inline nejsou vůbec.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # REST i WebSocket API. Koncové lomítko u proxy_pass odřízne prefix /api,
    # takže /api/replay/... dorazí do FastAPI jako /replay/...
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket /api/ws/live — bez upgrade hlaviček by handshake spadl na 400
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Živý stream nesmí spadnout na proxy timeoutu mezi framy (klidné noci)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # /replay balík je ~12 MB a záloha DB streamuje pg_dump — bufferování
        # na disk by jen přidalo latenci
        proxy_buffering off;
    }

    # SPA fallback; $uri/ zajistí, že adresáře (např. /manual/) dostanou svůj index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# CI: lint + testy Python (engine, api) a frontendu na každý PR a push do main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gexlens
          POSTGRES_PASSWORD: gexlens
          POSTGRES_DB: gexlens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gexlens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GEXLENS_TEST_PG_DSN: postgresql+psycopg://gexlens:gexlens@localhost:5432/gexlens
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --all-packages
      # Klient PostgreSQL 16 pro test obnovy (#1800): pg_dump a pg_restore stejné verze
      # jako služba a image (klient 17 posílá serveru 16 neznámé `transaction_timeout`).
      # ubuntu-latest (26.04) klienta 16 v distribuci nemá, proto oficiální repozitář
      # PGDG jako v docker/python.Dockerfile; PATH jde přednostně na verzi 16.
      - name: klient PostgreSQL 16
        run: |
          if ! test -x /usr/lib/postgresql/16/bin/pg_restore; then
            key=https://www.postgresql.org/media/keys/ACCC4CF8.asc
            curl -fsSL "$key" | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
            codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
            repo=https://apt.postgresql.org/pub/repos/apt
            line="deb [signed-by=/usr/share/keyrings/pgdg.gpg] $repo ${codename}-pgdg main"
            echo "$line" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends postgresql-client-16
          fi
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
          /usr/lib/postgresql/16/bin/pg_restore --version
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy engine/src engine/tests api/src api/tests news-engine/src news-engine/tests
      - run: uv run pytest

  # Celá sada na arm64 (#1798, ADR-0063): server Oracle A1 je aarch64 (Ampere).
  # Hlídá golden testy výpočtů (numpy/pyarrow na aarch64 sčítají jinými SIMD
  # instrukcemi — riziko jiného zaokrouhlení float) a nativní wheely z uv.lock.
  # Lint a mypy na architektuře nezávisí, běží jen v jobu `python`; jeho název
  # se nemění, ruleset `main` ho vyžaduje jako povinný check. PG služba
  # odpovídá jobu `python`.
  python-arm64:
    runs-on: ubuntu-24.04-arm
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gexlens
          POSTGRES_PASSWORD: gexlens
          POSTGRES_DB: gexlens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gexlens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GEXLENS_TEST_PG_DSN: postgresql+psycopg://gexlens:gexlens@localhost:5432/gexlens
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --all-packages
      # Klient PostgreSQL 16 pro test obnovy (#1800): pg_dump a pg_restore stejné verze
      # jako služba a image (klient 17 posílá serveru 16 neznámé `transaction_timeout`).
      # ubuntu-latest (26.04) klienta 16 v distribuci nemá, proto oficiální repozitář
      # PGDG jako v docker/python.Dockerfile; PATH jde přednostně na verzi 16.
      - name: klient PostgreSQL 16
        run: |
          if ! test -x /usr/lib/postgresql/16/bin/pg_restore; then
            key=https://www.postgresql.org/media/keys/ACCC4CF8.asc
            curl -fsSL "$key" | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
            codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
            repo=https://apt.postgresql.org/pub/repos/apt
            line="deb [signed-by=/usr/share/keyrings/pgdg.gpg] $repo ${codename}-pgdg main"
            echo "$line" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends postgresql-client-16
          fi
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
          /usr/lib/postgresql/16/bin/pg_restore --version
      # Pojistka, že runner je opravdu aarch64 (štítek runneru se může změnit)
      - run: uv run python -c "import platform, sys; m = platform.machine(); print(m); sys.exit(m != 'aarch64')"
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    # 19. 8. visel job 3× přes 15 minut na stahování Chromia (#782) — bez
    # timeoutu by držel runner až 6 h; celý job normálně trvá ~2 minuty
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format
      - run: npm test
      - run: npm run build
      # Smoke PRODUKČNÍHO bundlu (#154): build se dosud jen stavěl, nikdy nespustil —
      # runtime chyba viditelná jen v produkci (#146, bílá stránka) by prošla
      # Cache Chromia (#782): download z Playwright CDN opakovaně visí desítky
      # minut. Klíč z package-lock — nová verze @playwright/test = nový download
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      # BEZ --with-deps (#782 follow-up): apt část tahala volitelné CJK fonty
      # ze šnečího Azure mirroru (19. 8. 2 min/balík → timeout) — systémové
      # knihovny Chromia má runner image předinstalované, smoke fonty nepotřebuje
      - run: npx playwright install chromium
        timeout-minutes: 6
      - run: npm run smoke

  # Bezpečnostní skeny (#542). Drží stav, který prověrka nastavila: žádný
  # uniklý klíč v historii a žádná známá zranitelnost v závislostech.
  # Sken images (trivy) sem NEPATŘÍ — nálezy jsou OS balíky base image, řeší
  # je rebuild, ne PR; na ně je `scripts/security-scan.ps1 -Images`.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks skenuje celou historii, ne jen špičku
      # Compose smoke (#696): interpolace a env_file obou stacků musí projít
      # i bez lokálního .env (dummy tajemství; .env.dev je volitelný)
      - name: docker compose config
        run: |
          touch .env
          GEXLENS_PG_PASSWORD=ci GEXLENS_API_TOKEN=ci docker compose -f compose.yml config -q
          GEXLENS_PG_PASSWORD=ci GEXLENS_API_TOKEN=ci docker compose -f compose.dev.yml config -q
          # Server override (#1094): IB Gateway kontejner + secret ze souboru
          mkdir -p secrets && echo ci > secrets/ibkr_password
          GEXLENS_PG_PASSWORD=ci GEXLENS_API_TOKEN=ci IBKR_DATA_USERID=ci             docker compose -f compose.yml -f compose.server.yml config -q
      # Skripty serveru (#1802) běží jen při zakládání a bootstrapu serveru, chyba v nich
      # by se jinak ukázala až tam. shellcheck je v runner image předinstalovaný.
      - name: shellcheck scripts/server a restore.sh
        run: |
          shellcheck --version
          shellcheck scripts/server/*.sh scripts/restore.sh
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --redact --verbose
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: pip-audit
        run: |
          uv export --format requirements-txt --all-packages --no-emit-workspace -o /tmp/req.txt
          uvx pip-audit -r /tmp/req.txt --no-deps
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Audit endpoint registru npm občas neodpovídá (4. 9. 2026 celé dopoledne
      # 503/400) — to není nález, ale shazovalo to každý PR i main. Tři pokusy
      # s pauzou; přetrvávající výpadek endpointu = varování, ne červené CI.
      # Skutečné zranitelnosti (report + exit 1) dál padají. High a critical posuzuje
      # `scripts/npm-audit-gate.mjs` jako `--audit-level=high`, jen advisory bez opravené
      # verze smí mít dočasnou výjimku do data (#1837); po datu zase blokuje.
      - name: npm audit
        working-directory: frontend
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npm audit --json > audit.json 2> audit.log || true
            rc=0
            node ../scripts/npm-audit-gate.mjs audit.json || rc=$?
            if [ "$rc" -ne 2 ] && ! grep -q "audit endpoint returned an error" audit.log; then
              exit "$rc"
            fi
            echo "npm audit endpoint nedostupný (pokus $attempt/3)"
            sleep 30
          done
          cat audit.log
          echo "::warning::npm audit endpoint nedostupný po 3 pokusech — audit přeskočen (nález se neprokazuje ani nevylučuje)"
          exit 0

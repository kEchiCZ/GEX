# CI: lint + testy Python (engine, api) a frontendu na každý PR a push do main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gexlens
          POSTGRES_PASSWORD: gexlens
          POSTGRES_DB: gexlens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gexlens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GEXLENS_TEST_PG_DSN: postgresql+psycopg://gexlens:gexlens@localhost:5432/gexlens
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-packages
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy engine/src engine/tests api/src api/tests news-engine/src news-engine/tests
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    # 19. 8. visel job 3× přes 15 minut na stahování Chromia (#782) — bez
    # timeoutu by držel runner až 6 h; celý job normálně trvá ~2 minuty
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format
      - run: npm test
      - run: npm run build
      # Smoke PRODUKČNÍHO bundlu (#154): build se dosud jen stavěl, nikdy nespustil —
      # runtime chyba viditelná jen v produkci (#146, bílá stránka) by prošla
      # Cache Chromia (#782): download z Playwright CDN opakovaně visí desítky
      # minut. Klíč z package-lock — nová verze @playwright/test = nový download
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      # BEZ --with-deps (#782 follow-up): apt část tahala volitelné CJK fonty
      # ze šnečího Azure mirroru (19. 8. 2 min/balík → timeout) — systémové
      # knihovny Chromia má runner image předinstalované, smoke fonty nepotřebuje
      - run: npx playwright install chromium
        timeout-minutes: 6
      - run: npm run smoke

  # Bezpečnostní skeny (#542). Drží stav, který prověrka nastavila: žádný
  # uniklý klíč v historii a žádná známá zranitelnost v závislostech.
  # Sken images (trivy) sem NEPATŘÍ — nálezy jsou OS balíky base image, řeší
  # je rebuild, ne PR; na ně je `scripts/security-scan.ps1 -Images`.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks skenuje celou historii, ne jen špičku
      # Compose smoke (#696): interpolace a env_file obou stacků musí projít
      # i bez lokálního .env (dummy tajemství; .env.dev je volitelný)
      - name: docker compose config
        run: |
          touch .env
          GEXLENS_PG_PASSWORD=ci GEXLENS_API_TOKEN=ci docker compose -f compose.yml config -q
          GEXLENS_PG_PASSWORD=ci GEXLENS_API_TOKEN=ci docker compose -f compose.dev.yml config -q
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --redact --verbose
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: pip-audit
        run: |
          uv export --format requirements-txt --all-packages --no-emit-workspace -o /tmp/req.txt
          uvx pip-audit -r /tmp/req.txt --no-deps
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Audit endpoint registru npm občas neodpovídá (4. 9. 2026 celé dopoledne
      # 503/400) — to není nález, ale shazovalo to každý PR i main. Tři pokusy
      # s pauzou; přetrvávající výpadek endpointu = varování, ne červené CI.
      # Skutečné zranitelnosti (report + exit 1) dál padají.
      - name: npm audit
        working-directory: frontend
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm audit --audit-level=high > audit.log 2>&1; then
              cat audit.log
              exit 0
            fi
            if grep -q "audit endpoint returned an error" audit.log; then
              echo "npm audit endpoint nedostupný (pokus $attempt/3)"
              sleep 30
              continue
            fi
            cat audit.log
            exit 1
          done
          cat audit.log
          echo "::warning::npm audit endpoint nedostupný po 3 pokusech — audit přeskočen (nález se neprokazuje ani nevylučuje)"
          exit 0

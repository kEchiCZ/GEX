# Image pro produkci se staví v CI, ne na notebooku (#1139): lokální build
# (uv sync + vite) bral 2–3 GB paměti a 5–15 min plné zátěže vedle běžícího
# enginu, 12. 9. 2026 zaplnil disk a shodil containerd. Po mergi do main se tu
# postaví python image (engine/api/news-engine sdílejí jeden Dockerfile) a
# frontend image a pushnou do GHCR; doma pak stačí `docker compose pull`.
#
# Dvě architektury (#1798, ADR-0063): PC je amd64, server Oracle A1 arm64.
# Každý image se staví nativně na runneru své architektury (bez QEMU, které
# by uv sync a vite zpomalilo řádově), před pushem projde smoke a pushne se
# jen podle digestu. Job `manifest` pak oba digesty spojí do jednoho indexu
# pod stávajícími tagy `latest` a `sha-<7>` — `docker compose pull` si na
# každém stroji vezme svou architekturu sám a deploy skript ani návrat pinem
# tagu se nemění. Selže-li jedna architektura image, nový tag toho image
# nevznikne: oba stroje tak běží vždy na stejné revizi. Image se tagují
# navzájem nezávisle jako před #1798 — rozbitý build frontendu nezablokuje
# nasazení enginu.
#
# Bezpečnost: repo je veřejné → Actions minuty (i arm64 runnery) a veřejné
# balíčky GHCR jsou zdarma. Do image jde jen to, co Dockerfile explicitně
# kopíruje (zdrojáky, lockfile) — `.env*`, `data/` a `docs/` vylučuje
# `.dockerignore` a Dockerfile nemá žádný `COPY . .`. Push používá automatický
# GITHUB_TOKEN workflow (jen `packages: write` pro tento repozitář), žádný
# osobní token.
name: Images

on:
  push:
    branches: [main]
    paths:
      - "engine/**"
      - "api/**"
      - "news-engine/**"
      - "pyproject.toml"
      - "uv.lock"
      - "frontend/**"
      - "docker/**"
      - ".github/workflows/images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# bash s pipefail i bez `shell:` u kroku — jinak by chyba uprostřed roury zapadla
defaults:
  run:
    shell: bash

env:
  REGISTRY: ghcr.io
  # GHCR vyžaduje malá písmena; github.repository_owner je "kEchiCZ"
  OWNER: kechicz

jobs:
  build:
    name: ${{ matrix.image }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      # Druhá architektura doběhne i při pádu první — v logu jsou vidět obě
      fail-fast: false
      matrix:
        image: [gex-python, gex-frontend]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
          - image: gex-python
            file: docker/python.Dockerfile
            title: gexlens-python
            description: GEXLens engine / api / news-engine (jeden image, tři služby)
            # Revize do manifestu úplné zálohy (#1799, GEXLENS_BUILD_SHA)
            build-args: GEXLENS_BUILD_SHA=${{ github.sha }}
          - image: gex-frontend
            file: docker/frontend.Dockerfile
            title: gexlens-frontend
            description: GEXLens frontend (statický bundle za nginx, /api proxy)
            # Produkční hodnoty = výchozí ARG v Dockerfile (VITE_API_BASE=/api, bez
            # VITE_GEXLENS_ENV); commit jde do exportu měřiče výkonu (#1409)
            build-args: VITE_BUILD_SHA=${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}
          # Label `org.opencontainers.image.revision` (= commit) čte deploy skript
          # po pullu, aby nasadil právě HEAD main
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
      # Nejdřív do lokálního daemonu runneru: smoke běží nad hotovým image
      # dřív, než se cokoli pushne
      - name: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: gexlens-smoke:local
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }},mode=max
      # Smoke python image: nativní wheely (numpy, pyarrow, psycopg binary,
      # pandas, matplotlib, curl_cffi, uvloop) se na aarch64 musí načíst
      # a pyarrow zapsat a přečíst parquet; pg_dump musí být 16 kvůli
      # serveru postgres:16 (#439). Běží přes entrypoint, takže ověří
      # i přepnutí na neprivilegovaného uživatele (setpriv, #542).
      - name: smoke python
        if: matrix.image == 'gex-python'
        run: |
          docker run --rm gexlens-smoke:local python -c '
          import platform
          import curl_cffi, matplotlib, numpy, pandas, psycopg, uvloop
          import pyarrow as pa, pyarrow.parquet as pq
          import gexlens_api, gexlens_engine, gexlens_news
          import os
          from importlib import resources
          assert len(os.environ["GEXLENS_BUILD_SHA"]) == 40, "chybí revize image (#1799)"
          assert resources.files("gexlens_api").joinpath("restore_template.md").read_text()
          assert psycopg.pq.__impl__ == "binary", psycopg.pq.__impl__
          pq.write_table(pa.table({"x": numpy.arange(3.0)}), "/tmp/smoke.parquet")
          assert pq.read_table("/tmp/smoke.parquet").column("x").to_pylist() == [0.0, 1.0, 2.0]
          print("smoke OK", platform.machine(), "numpy", numpy.__version__, "pyarrow", pa.__version__)
          '
          docker run --rm gexlens-smoke:local pg_dump --version | tee /dev/stderr \
            | grep -Eq '^pg_dump \(PostgreSQL\) 16\.'
      - name: smoke frontend
        if: matrix.image == 'gex-frontend'
        run: |
          docker run --rm gexlens-smoke:local nginx -t
          docker run --rm gexlens-smoke:local test -s /usr/share/nginx/html/index.html
      # Druhý průchod je celý z cache builderu (stejné vrstvy, stejné labely);
      # push jen podle digestu, tagy dostane až index v jobu `manifest`
      - name: push podle digestu
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build-args }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
      - name: export digestu
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest='${{ steps.push.outputs.digest }}'
          test -n "$digest"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: manifest ${{ matrix.image }}
    needs: build
    # I po pádu jiného buildu: každý image se rozhoduje jen podle svých dvou
    # digestů (kontrola počtu níž), pád gex-frontend arm64 neblokuje gex-python
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [gex-python, gex-frontend]
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}
          # `latest` = aktuální main, jen z main: workflow_dispatch z jiné větve
          # (zkouška workflow) dostane jen svůj `sha-<7>` a produkční `latest`
          # nepřepíše. `sha-<7>` = přesná revize pro návrat pinem (ADR-0047)
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
      - name: index pod tagy
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}
        run: |
          n=$(ls -1 | wc -l)
          if [ "$n" -ne 2 ]; then
            echo "::error::Čekám dva digesty (amd64 a arm64), je jich $n"; exit 1
          fi
          tags=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          sources=$(printf "$IMAGE@sha256:%s " *)
          # Nejdřív nanečisto: tag vznikne, jen když výsledný index má obě
          # architektury (záznamy provenance mají platformu unknown/unknown)
          platforms=$(docker buildx imagetools create --dry-run $tags $sources \
            | jq -r '.manifests[].platform | "\(.os)/\(.architecture)"' | sort -u)
          echo "$platforms"
          for p in linux/amd64 linux/arm64; do
            grep -qx "$p" <<< "$platforms" || { echo "::error::Index bez $p"; exit 1; }
          done
          docker buildx imagetools create $tags $sources
      # Výsledek z registru do logu (Platform: linux/amd64, linux/arm64)
      - name: index v registru
        run: docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}:sha-${GITHUB_SHA::7}"
